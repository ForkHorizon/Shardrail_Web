target-version = "py311"
line-length = 120
exclude = [
    "apps/web/b3-bench.py",
    "apps/web/tests/fixtures",
    "**/node_modules",
]

[lint]
select = [
    "E",
    "W",
    "F",
    "B",
    "C4",
    "SIM",
    "ARG",
    "PL",
    "RUF",
    "UP",
    "N",
    "BLE",
    "S110",
    "PGH003",
]
ignore = [
    "PLR2004",
    "E501",
]
